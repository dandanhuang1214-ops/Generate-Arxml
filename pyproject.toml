[project]
name = "arxml-codegen"
version = "0.1.0"
description = "Generate AUTOSAR ARXML artifacts from Excel-based signal and service definitions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1.5",
  "lxml>=5.3.0",
  "pydantic>=2.9.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.9",
]

[project.scripts]
arxml-codegen = "arxml_codegen.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
